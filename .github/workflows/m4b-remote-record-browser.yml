name: M4B Read-Only Remote Record Browser Qualification

on:
  push:
    branches:
      - codex/m4b-remote-record-browser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4b-android:
    name: M4B scoped auth and remote record browser
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37.0
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Run M4A preservation and M4B mock HTTP tests
        run: |
          chmod +x gradlew
          ./gradlew :collect_app:testDebug \
            --tests org.odk.collect.android.recordwork.RecordWorkContractsTest \
            --tests org.odk.collect.android.recordwork.RecordWorkReadOnlyClientTest \
            --no-daemon --stacktrace
      - name: Compile Data Collector debug APK
        run: |
          ./gradlew :collect_app:assembleDebug \
            -PCOLLECT_SERVER_URL=https://collector.example.org/v1/projects/00000000-0000-0000-0000-000000000000 \
            --no-daemon --stacktrace
      - name: Verify Android package identity and app label
        run: |
          set -euo pipefail
          apk="$(find collect_app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/data-collector-badging.txt
          grep -Fq "package: name='org.jeresaf.datacollector.android'" /tmp/data-collector-badging.txt
          grep -Fq "application-label:'Data Collector'" /tmp/data-collector-badging.txt
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m4b-test-evidence
          path: |
            collect_app/build/test-results
            collect_app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14
