name: M4B2 Record Selection and Preparation Qualification

on:
  push:
    branches:
      - codex/m4b2-record-selection-prepare
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4b2-record-work-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m4b2-android:
    name: M4B2 selection, authorization and preview
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: M4A, M4B and M4B2 contract tests
        run: |
          chmod +x gradlew
          ./gradlew :collect_app:testDebug \
            --tests org.odk.collect.android.recordwork.RecordWorkContractsTest \
            --tests org.odk.collect.android.recordwork.RecordWorkReadOnlyClientTest \
            --tests org.odk.collect.android.recordwork.RecordWorkPreparationClientTest \
            --no-daemon --stacktrace
      - name: Compile branded APK
        run: |
          ./gradlew :collect_app:assembleDebug \
            -PCOLLECT_SERVER_URL=https://collector.example.org/v1/projects/00000000-0000-0000-0000-000000000000 \
            --no-daemon --stacktrace
      - name: Verify app identity
        run: |
          set -euo pipefail
          apk="$(find collect_app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/m4b2-badging.txt
          grep -Fq "package: name='org.jeresaf.datacollector.android'" /tmp/m4b2-badging.txt
          grep -Fq "application-label:'Data Collector'" /tmp/m4b2-badging.txt
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m4b2-test-evidence
          path: |
            collect_app/build/test-results
            collect_app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14
