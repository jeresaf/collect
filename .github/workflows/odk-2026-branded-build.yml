name: ODK 2026 Branded APK Qualification

on:
  push:
    branches:
      - codex/odk-2026-app-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branded-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37.0
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test branding, providers, and URL provisioning
        run: |
          chmod +x gradlew
          ./gradlew :collect_app:testDebug \
            --tests org.odk.collect.android.projects.PreconfiguredProjectInitializerTest \
            --tests org.odk.collect.android.external.BrandedContentProviderContractsTest \
            --tests org.odk.collect.android.formlists.blankformlist.BlankFormListItemTest \
            --no-daemon --stacktrace
      - name: Assemble branded debug APK with only a server URL
        run: |
          ./gradlew :collect_app:assembleDebug \
            -PCOLLECT_SERVER_URL=https://collector.example.org/v1/projects/00000000-0000-0000-0000-000000000000 \
            --no-daemon --stacktrace
      - name: Verify APK package and branded label
        run: |
          set -euo pipefail
          apk="$(find collect_app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/collect-badging.txt
          grep -q "package: name='org.jeresaf.datacollector.android'" /tmp/collect-badging.txt
          grep -q "application-label:'Data Collector'" /tmp/collect-badging.txt
          echo "Verified package and display label"
      - name: Publish test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: odk-2026-branded-test-reports
          path: |
            collect_app/build/test-results
            collect_app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14
