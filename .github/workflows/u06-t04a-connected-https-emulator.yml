name: U06-T04A Connected Android HTTPS Smoke (experimental)

on:
  push:
    branches: [codex/u06-t04a-connected-https-emulator, codex/u06-t04b-authenticated-record-wire, codex/u06-t04b02-amendment-admission, codex/u06-t04c01-followup-admission, codex/u06-t04c02-stale-recovery, codex/u06-t04c02b-draft-restart, codex/u06-t04c03a-followup-submission, codex/u06-t04c03b-repeats-media, codex/u06-t04c03c-lost-ack-recovery, codex/u06-t04d01-ui-fail-closed, codex/u06-t04d02-ui-context-invariants, codex/u06-t04d03-record-row-ui, codex/u06-t04d03b-record-intent, codex/u06-t04d03b2a-active-project-preparation-ui, codex/u06-t04d03b2b-live-record-preparation-ui, codex/u06-t04d03c1-pending-work-ui, codex/u06-t04d04a-actual-browser-activity, codex/u06-t04d04b1-target-version-ui, codex/u06-t04d04b2-ui-followup-create, codex/u06-t04e01-unstaged-native-editor-denial, codex/u06-t04e02a-ui-reviewed-staging, codex/u06-t04e02b-authorized-protected-editor, codex/u06-t04e03a-protected-editor-save, codex/u06-t04e03b-editor-process-recovery, codex/u06-t04e03c1-native-controller-boundary, codex/u06-t04e03c2-native-answer-navigation, codex/u06-t04e03c3-native-repeat-editing, codex/u06-t04e03c4-native-conditional-validation, codex/u06-t04e03c5-native-image-binding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-android-postgres-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: odk_platform
          POSTGRES_USER: odk_user
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odk_user -d odk_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Android source (exact branch commit)
        uses: actions/checkout@v4
      - name: Checkout verified backend base
        uses: actions/checkout@v4
        with:
          repository: jeresaf/data-collector
          ref: e1ef46967d05e4cdf82c088199f5fc76fc065c34
          path: backend-reference
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build genuine Spring Boot service
        working-directory: backend-reference/backend
        run: mvn -B -ntp -DskipTests package
      - name: Run backend with ephemeral PostgreSQL 15/Flyway
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/odk_platform
          SPRING_DATASOURCE_USERNAME: odk_user
          SPRING_DATASOURCE_PASSWORD: synthetic-ci-only
          STORAGE_LOCAL_PATH: /tmp/u06-t04a-data
        run: |
          set -euo pipefail
          mkdir -p /tmp/u06-t04a-data
          export JWT_SECRET="$(openssl rand -hex 48)"
          jar="$(find backend-reference/backend/target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n1)"
          test -n "$jar"
          nohup java -jar "$jar" >/tmp/u06-t04a-backend.log 2>&1 &
          echo "$!" >/tmp/u06-t04a-backend.pid
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health |
                grep -q '"status":"UP"'; then
              ready=1
              break
            fi
            kill -0 "$(cat /tmp/u06-t04a-backend.pid)" || exit 1
            sleep 2
          done
          test "$ready" = 1
      - name: Seed disposable V1/V2 PostgreSQL record fixtures
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U odk_user -d odk_platform \
            -f ci/u06-t04b-owned-revisions.sql
          count="$(psql -tAX -h 127.0.0.1 -U odk_user -d odk_platform \
            -c "SELECT count(*) FROM submissions WHERE id IN ('81000000-0000-4000-8000-000000000007','81000000-0000-4000-8000-000000000008')")"
          test "$count" = 2
      - name: Generate per-run CA and SSL endpoint for emulator host bridge
        run: |
          set -euo pipefail
          mkdir -m 700 /tmp/u06-t04a-tls
          cd /tmp/u06-t04a-tls
          openssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 1 \
            -keyout ca.key -out ca.crt -subj '/CN=U06 T04A temporary CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:3072 -nodes -keyout server.key -out server.csr \
            -subj '/CN=10.0.2.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.0.2.2,DNS:localhost' \
            'extendedKeyUsage=serverAuth' 'keyUsage=digitalSignature,keyEncipherment' >server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out server.crt -days 1 -sha256 -extfile server.ext >/dev/null 2>&1
          openssl verify -CAfile ca.crt server.crt
          cat >nginx.conf <<'NGINX'
          events {}
          http {
            access_log off;
            server {
              listen 8443 ssl;
              ssl_certificate /tls/server.crt;
              ssl_certificate_key /tls/server.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto https;
              }
            }
          }
          NGINX
          docker run -d --name u06-t04a-tls --network host \
            -v /tmp/u06-t04a-tls:/tls:ro \
            -v /tmp/u06-t04a-tls/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' u06-t04a-tls)" = true
          curl --fail --silent --show-error --cacert ca.crt \
            --resolve localhost:8443:127.0.0.1 \
            https://localhost:8443/actuator/health | grep -q '"status":"UP"'
      - name: Supply ephemeral CA to test APK only
        run: |
          mkdir -p collect_app/src/androidTest/assets
          cp /tmp/u06-t04a-tls/ca.crt collect_app/src/androidTest/assets/u06_t04a_ca.pem
          test -s collect_app/src/androidTest/assets/u06_t04a_ca.pem
          test ! -f collect_app/src/main/res/raw/u06_t04a_ca.pem
      - name: Install Android SDK and Gradle
        uses: android-actions/setup-android@v4
      - name: Install project Android SDK
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] &&
             [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Select primary Maven Central endpoint on disposable runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text()
          assert s.count("mavenCentral()") == 2
          p.write_text(s.replace("mavenCentral()", 'maven { url = uri("https://repo.maven.apache.org/maven2/") }'))
          PY
      - name: Verify emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Instrument real API 35 Android TLS request (not mocked)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash ci/u06-t04c02b-process-restart.sh
      - name: Verify durable PostgreSQL amendment admission postconditions
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          set -euo pipefail
          query() {
            psql -tAX -v ON_ERROR_STOP=1 -h 127.0.0.1 -U odk_user -d odk_platform -c "$1"
          }
          stale="$(query "SELECT count(*) FROM record_work_items WHERE source_submission_id='81000000-0000-4000-8000-000000000007' AND work_type='AMENDMENT'")"
          current="$(query "SELECT count(*) FROM record_work_items WHERE source_submission_id='81000000-0000-4000-8000-000000000008' AND work_type='AMENDMENT' AND state='READY'")"
          followups="$(query "SELECT count(*) FROM record_work_items WHERE source_submission_id='81000000-0000-4000-8000-000000000007' AND work_type='FOLLOW_UP' AND visit_key='second-household-visit' AND state='READY'")"
          links="$(query "SELECT count(*) FROM record_links")"
          submissions="$(query "SELECT count(*) FROM submissions WHERE id IN ('81000000-0000-4000-8000-000000000007','81000000-0000-4000-8000-000000000008')")"
          test "$stale" = 0
          test "$current" = 1
          test "$followups" = 1
          test "$links" = 1
          completed="$(query "SELECT count(*) FROM record_work_items WHERE work_type='FOLLOW_UP' AND state='COMPLETED' AND source_submission_id='81000000-0000-4000-8000-000000000007' AND visit_key LIKE 'completed-visit-%'")"
          child="$(query "SELECT count(*) FROM record_links r JOIN record_work_items w ON w.id=r.work_item_id JOIN submissions s ON s.id=r.child_submission_id WHERE r.source_submission_id='81000000-0000-4000-8000-000000000007' AND r.link_type='FOLLOW_UP' AND s.form_version_id='81000000-0000-4000-8000-000000000004' AND s.xml_content LIKE '%Synthetic independent later visit%' AND w.state='COMPLETED'")"
          original_xml="$(query "SELECT count(*) FROM submissions WHERE id='81000000-0000-4000-8000-000000000007' AND xml_content LIKE '%Synthetic V1%'")"
          untouched_archive="$(query "SELECT count(*) FROM submission_versions WHERE submission_id='81000000-0000-4000-8000-000000000007' AND xml_content LIKE '%Synthetic V1%'")"
          all_submissions="$(query "SELECT count(*) FROM submissions WHERE form_id='81000000-0000-4000-8000-000000000002'")"
          test "$completed" = 1
          test "$child" = 1
          test "$original_xml" = 1
          test "$untouched_archive" = 1
          test "$all_submissions" = 3
          pending_ui="$(query "SELECT count(*) FROM record_work_items WHERE work_type='FOLLOW_UP' AND state='READY' AND source_submission_id='81000000-0000-4000-8000-000000000007' AND client_request_id LIKE 'u06-ui-pending-request-%' AND visit_key LIKE 'u06-ui-pending-%'")"
          pending_ui_links="$(query "SELECT count(*) FROM record_links l JOIN record_work_items w ON w.id=l.work_item_id WHERE w.client_request_id LIKE 'u06-ui-pending-request-%'")"
          test "$pending_ui" = 1
          test "$pending_ui_links" = 0
          echo "U06-T04D-03C1: exactly one server-owned READY UI follow-up; no premature child/link"
          confirmed_ui="$(query "SELECT count(*) FROM record_work_items WHERE work_type='FOLLOW_UP' AND state='READY' AND source_submission_id='81000000-0000-4000-8000-000000000007' AND client_request_id LIKE 'm4b2-%' AND visit_key LIKE 'u06-ui-create-%'")"
          confirmed_ui_links="$(query "SELECT count(*) FROM record_links l JOIN record_work_items w ON w.id=l.work_item_id WHERE w.visit_key LIKE 'u06-ui-create-%'")"
          test "$confirmed_ui" = 1
          test "$confirmed_ui_links" = 0
          echo "U06-T04D-04B2: exactly one user-confirmed READY UI follow-up; zero child submissions or links"
          scalar_ui="$(query "SELECT count(*) FROM record_work_items WHERE work_type='FOLLOW_UP' AND state='READY' AND source_submission_id='81000000-0000-4000-8000-000000000007' AND target_form_version_id='81000000-0000-4000-8000-000000000003' AND client_request_id LIKE 'u06-scalar-editor-request-%' AND visit_key LIKE 'u06-scalar-editor-%'")"
          scalar_ui_links="$(query "SELECT count(*) FROM record_links l JOIN record_work_items w ON w.id=l.work_item_id WHERE w.visit_key LIKE 'u06-scalar-editor-%'")"
          test "$scalar_ui" = 1
          test "$scalar_ui_links" = 0
          echo "U06-T04E-02B: authorized scalar editor opened; exactly one READY work and zero new child links"
          conditional_ui="$(query "SELECT count(*) FROM record_work_items WHERE work_type='FOLLOW_UP' AND state='READY' AND source_submission_id='81000000-0000-4000-8000-000000000007' AND target_form_version_id='81000000-0000-4000-8000-000000000019' AND client_request_id LIKE 'u06-conditional-request-%' AND visit_key LIKE 'u06-conditional-%'")"
          conditional_links="$(query "SELECT count(*) FROM record_links l JOIN record_work_items w ON w.id=l.work_item_id WHERE w.visit_key LIKE 'u06-conditional-%'")"
          test "$conditional_ui" = 1
          test "$conditional_links" = 0
          echo "U06-T04E-03C4: conditional target remains READY; no child links or submissions"


          duplicate_instance="$(query "SELECT count(*) FROM submissions s JOIN record_links l ON l.child_submission_id=s.id WHERE l.link_type='FOLLOW_UP' AND s.instance_id LIKE 'uuid:%' AND s.xml_content LIKE '%Synthetic independent later visit%'")"
          completed_once="$(query "SELECT count(*) FROM record_work_items w JOIN record_links l ON l.work_item_id=w.id WHERE w.state='COMPLETED' AND w.client_request_id LIKE 'completed-work-%' AND w.visit_key LIKE 'completed-visit-%' AND l.link_type='FOLLOW_UP'")"
          attachment_once="$(query "SELECT count(*) FROM submission_attachments sa JOIN record_links l ON l.child_submission_id=sa.submission_id WHERE l.link_type='FOLLOW_UP' AND sa.file_name='u06-followup-photo.jpg'")"
          test "$duplicate_instance" = 1
          test "$completed_once" = 1
          test "$attachment_once" = 1
          echo "U06-T04C-03C replay postflight PASS: exactly one submitted visit, completed work, link and media attachment after lost ACK"
          test "$submissions" = 2
          repeat_rows="$(query "SELECT count(*) FROM submission_answers a JOIN record_links l ON l.child_submission_id=a.submission_id WHERE l.link_type='FOLLOW_UP' AND a.path IN ('children[0]/child_age_text','children[1]/child_age_text')")"
          repeat_names="$(query "SELECT count(*) FROM submission_answers a JOIN record_links l ON l.child_submission_id=a.submission_id WHERE l.link_type='FOLLOW_UP' AND a.path IN ('children[0]/child_name','children[1]/child_name')")"
          photo_link="$(query "SELECT count(*) FROM submission_attachments sa JOIN record_links l ON l.child_submission_id=sa.submission_id JOIN submission_answers a ON a.id=sa.answer_id WHERE l.link_type='FOLLOW_UP' AND sa.file_name='u06-followup-photo.jpg' AND a.path='photo'")"
          untouched_original_media="$(query "SELECT count(*) FROM submission_attachments WHERE submission_id='81000000-0000-4000-8000-000000000007'")"
          test "$repeat_rows" = 2
          test "$repeat_names" = 2
          test "$photo_link" = 1
          test "$untouched_original_media" = 0
          stored_path="$(query "SELECT sa.storage_path FROM submission_attachments sa JOIN record_links l ON l.child_submission_id=sa.submission_id WHERE l.link_type='FOLLOW_UP' AND sa.file_name='u06-followup-photo.jpg'")"
          test -f "$stored_path"
          test "$(xxd -p "$stored_path" | tr -d '\n')" = 'ffd8ffe000104a464946000111223344ffd9'
          stored_hash="$(query "SELECT sa.content_hash FROM submission_attachments sa JOIN record_links l ON l.child_submission_id=sa.submission_id WHERE l.link_type='FOLLOW_UP' AND sa.file_name='u06-followup-photo.jpg'")"
          test "$(sha256sum "$stored_path" | cut -d' ' -f1)" = "$stored_hash"
          echo "PostgreSQL repeat/media assertions PASS: two indexed child repeats, linked photo, byte-verified media and unchanged original"
          echo "PostgreSQL admission + follow-up submission assertions PASS: V1 amendment=0 V2 amendment=1 V1 planned visit=1 linked completed visit=1 links=1 total submissions=3 and source/archive preserved"
      - name: Cleanup disposable CA, server and temporary store
        if: always()
        run: |
          docker rm -f u06-t04a-tls >/dev/null 2>&1 || true
          if [ -f /tmp/u06-t04a-backend.pid ]; then
            kill "$(cat /tmp/u06-t04a-backend.pid)" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/u06-t04a-tls /tmp/u06-t04a-data
          rm -f collect_app/src/androidTest/assets/u06_t04a_ca.pem
      - name: Upload emulator test report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u06-t04a-real-android-tls-evidence
          path: |
            collect_app/build/outputs/androidTest-results
            collect_app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
